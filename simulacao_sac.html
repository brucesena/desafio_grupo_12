<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de financiamento SAC</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">    
</head>
<body>
      <div class="row">
        <a href="index.html">Voltar para a página inicial</a>
        <h1>SIMULAÇÃO SAC</h1>
      </div>
      <div class="row">
      <form class="p-4 border rounded-9 bg-light" id="dados_financiamento_sac">
        <div class="row">
          <div class="col-md-2">            
              <label class="form-label" for="valor_financiamento_sac">Valor do financiamento(R$):</label>
              <input class="form-control valores" type="text" id="valor_financiamento_sac" name="valor_financiamento_sac" required/>
          </div>
          <div class="col-md-2">
              <label class="form-label" for="valor_entrada_sac">Valor da entrada(R$):</label>
              <input class="form-control valores" type="text" id="valor_entrada_sac" name="valor_entrada_sac" required/>
          </div>                        
          
          <div class="col-md-2">
              <label class="form-label" for="taxa_juros_sac">Taxa de juros(%):</label>
              <input class="form-control" type="number" id="taxa_juros_sac" name="taxa_juros_sac" step="0.01"required/>
          </div>
          <div class="col-md-2">
              <label class="form-label" for="num_parcelas_sac">Número de parcelas:</label>
              <input class="form-control" type="number" id="num_parcelas_sac" name="num_parcelas_sac" required/>
          </div>
          <div class="d-grid gap-2 col-md-2">
            <button id="botao_gerar_parcelas" onclick="calcula_sac()" type="button" class="btn btn-primary">
              Gerar parcelas
            </button>
          </div>
        </div>
  
      </form>
      </div>

      <table class="table" name="tabela_sac" id="tabela_sac" border="1">
        <tr>
          <th>Parcela</th>
          <th>Valor da Parcela</th>
          <th>Amortização</th>
          <th>Juros</th>
          <th>Saldo Devedor</th>
          <th>Vencimento</th>
        </tr>
        <tbody id="corpo_tabela_sac">
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

</body>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <!-- add money mask-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-maskmoney/3.0.2/jquery.maskMoney.min.js"></script>
    <script src="assets/js/scripts.js"></script>
</html>
