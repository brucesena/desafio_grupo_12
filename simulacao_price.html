<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulação de financiamento PRICE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="container py-5">
      <main id="conteudo" class="app-shell">
        <a
          class="btn btn-outline-secondary btn-sm back-link mb-3"
          href="index.html"
        >
          <i class="bi bi-arrow-left"></i>Voltar para a página inicial
        </a>

        <div
          class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2"
        >
          <div>
            <h1 class="h3 fw-semibold mb-1">Simulação PRICE</h1>
            <p class="text-muted mb-0">Sistema Francês de Amortização</p>
          </div>
          <span class="badge badge-soft px-3 py-2">Parcelas iguais</span>
        </div>

        <div class="row g-4">
          <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body p-4">
                <h2 class="h5 section-title mb-3">Dados do financiamento</h2>
                <form id="dados_financiamento_price" class="row g-3">
                  <div class="col-12">
                    <label for="valor_financiamento_price" class="form-label"
                      >Valor do financiamento</label
                    >
                    <input
                      class="form-control valores"
                      type="text"
                      id="valor_financiamento_price"
                      name="valor_financiamento_price"
                      required
                    />
                  </div>

                  <div class="col-12">
                    <label for="valor_entrada_price" class="form-label"
                      >Valor da entrada</label
                    >
                    <input
                      class="form-control valores"
                      type="text"
                      id="valor_entrada_price"
                      name="valor_entrada_price"
                      required
                    />
                  </div>

                  <div class="col-12">
                    <label for="periodo_juros" class="form-label"
                      >Periodo de juros:</label
                    >
                    <select
                      class="form-control"
                      id="periodo_juros"
                      name="periodo_juros"
                      required
                    >
                    <option value="mensal" selected>Mensal</option>
                    <option value="trimestral">Trimestral</option>
                    <option value="semestral">Semestral</option>
                  </select>
                  </div>

                  <div class="col-12">
                    <label for="taxa_juros_price" class="form-label"
                      >Taxa de juros mensal (%)</label
                    >
                    <input
                      class="form-control"
                      type="number"
                      id="taxa_juros_price"
                      name="taxa_juros_price"
                      step="0.01"
                      required
                    />
                  </div>

                  <div class="col-12">
                    <label for="num_parcelas_price" class="form-label"
                      >Número de parcelas</label
                    >
                    <input
                      class="form-control"
                      type="number"
                      id="num_parcelas_price"
                      name="num_parcelas_price"
                      required
                    />
                  </div>

                  <div class="col-12 d-flex flex-wrap gap-2">
                    <button
                      onclick="calcula_price()"
                      type="button"
                      class="btn btn-primary flex-fill"
                    >
                      <i class="bi bi-calculator"></i>Gerar parcelas
                    </button>
                    <button type="reset" class="btn btn-outline-secondary">
                      <i class="bi bi-eraser"></i>Limpar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body p-4">
                <div
                  class="d-flex align-items-center justify-content-between mb-3"
                >
                  <h2 class="h5 section-title mb-0">Tabela de parcelas</h2>
                  <span class="text-muted small">PRICE</span>
                </div>
                <div class="table-responsive">
                  <table
                    class="table table-striped table-hover align-middle"
                    name="tabela_price"
                    id="tabela_price"
                  >
                    <thead class="table-light">
                      <tr>
                        <th>Parcela</th>
                        <th>Valor da Parcela</th>
                        <th>Amortização</th>
                        <th>Juros</th>
                        <th>Saldo Devedor</th>
                        <th>Vencimento</th>
                      </tr>
                    </thead>
                    <tbody id="corpo_tabela_price">
                      <tr>
                        <td>1</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-maskmoney/3.0.2/jquery.maskMoney.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/scripts.js"></script>
  </body>
</html>
