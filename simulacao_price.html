<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulação de financiamento PRICE</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="conteudo">
      <a href="index.html">Voltar para a página inicial</a>
      <h1>PRICE</h1>
      <div id="form">
        <form id="dados_financiamento_price">
          <label for="valor_financiamento_price"
            >Valor do financiamento(R$):</label
          >
          <input
            class="valores"
            type="text"
            id="valor_financiamento_price"
            name="valor_financiamento_price"
            required
          /><br /><br />

          <label for="valor_entrada_price">Valor da entrada(R$):</label>
          <input
            class="valores"
            type="text"
            id="valor_entrada_price"
            name="valor_entrada_price"
            required
          /><br /><br />

          <label for="periodo_juros" >Periodo de juros:</label>
          <select class="select" id="periodo_juros" name="periodo_juros" onChange="atualizaSelect()">
            <option value="mensal" selected>Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option>
          </select>
          <br /><br />

          <label for="taxa_juros_price">Taxa de juros mensal (%):</label>
          <input
            type="number"
            id="taxa_juros_price"
            name="taxa_juros_price"
            step="0.01"
            required
          /><br /><br />

          <label for="num_parcelas_price">Número de parcelas:</label>
          <input
            type="number"
            id="num_parcelas_price"
            name="num_parcelas_price"
            required
          /><br /><br />

          <button onclick="calcula_price()" type="button">
            Gerar parcelas
          </button>
        </form>
      </div>
      <div>
        <table name="tabela_price" id="tabela_price" border="1">
          <tr>
            <th>Parcela</th>
            <th>Valor da Parcela</th>
            <th>Amortização</th>
            <th>Periodo de Juros</th>
            <th>Juros</th>
            <th>Saldo Devedor</th>
            <th>Vencimento</th>
          </tr>
          <tbody id="corpo_tabela_price">
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <!-- add money mask-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-maskmoney/3.0.2/jquery.maskMoney.min.js"></script>
  <script src="assets/js/scripts.js"></script>
</html>
